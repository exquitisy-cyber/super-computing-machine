buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.minecraftforge.net/releases' }
        maven { url 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'org.jetbrains.kotlin.jvm'

group = 'mods.trnightmareegoautoclick'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/releases' }
    maven { url 'https://maven.neoforged.net/releases' }
}

minecraft {
    mappingChannel = 'official'
    mappingVersion = '1.21.1'
}

dependencies {
    minecraft 'net.minecraft:client:1.21.1-20240920.165612'
    implementation 'net.minecraftforge:forge:1.21.1-51.0.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs = ['-Xjsr305=strict']
    }
}